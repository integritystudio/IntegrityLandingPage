name: integrity_studio_ai
description: Enterprise AI Observability Platform Landing Page
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI/Animations
  flutter_animate: ^4.3.0
  visibility_detector: ^0.4.0+2
  google_fonts: ^9.0.0
  lottie: ^3.0.0

  # Icons/Images
  lucide_icons_flutter: ^3.1.17
  flutter_svg: ^2.0.9
  cupertino_icons: ^2.0.0  # bundle CupertinoIcons font referenced transitively (icon tree-shaker)

  # Networking
  dio: ^5.4.0
  http: ^1.1.0
  webview_flutter: ^4.8.0

  # Utilities
  crypto: ^3.0.7  # SHA-256 for the Auth0 PKCE code challenge
  url_launcher: ^6.2.2
  yaml: ^3.1.2

  # Code Generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^18.0.2

  # Error Tracking
  sentry_flutter: ^9.15.0

  # Web Interop (for GTM/Analytics)
  web: ^1.0.0
  marionette_flutter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  # build_runner 2.16.1 does not compile against analyzer 14.5.0 (published 2026-10-06:
  # "The setter 'contextFeatures' isn't defined for the type 'AnalysisOptionsImpl'"),
  # and pubspec.lock is not committed, so CI resolves the newest. Drop this cap once a
  # build_runner release builds against 14.5+.
  analyzer: ">=13.3.0 <14.5.0"
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  shelf: ^1.4.1

flutter:
  uses-material-design: true

  assets:
    - content.yaml
    - assets/images/
    - assets/icons/
    - assets/lottie/
