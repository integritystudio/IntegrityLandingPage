name: integrity_studio_ai
description: Enterprise AI Observability Platform Landing Page
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI/Animations
  flutter_animate: ^4.3.0
  visibility_detector: ^0.4.0+2
  google_fonts: ^8.0.0
  lottie: ^3.0.0

  # Icons/Images
  lucide_icons_flutter: ^3.1.17
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8  # bundle CupertinoIcons font referenced transitively (icon tree-shaker)

  # Networking
  dio: ^5.4.0
  http: ^1.1.0
  webview_flutter: ^4.8.0

  # Utilities
  url_launcher: ^6.2.2
  yaml: ^3.1.2

  # Code Generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^17.0.1

  # Error Tracking
  sentry_flutter: ^9.15.0

  # Web Interop (for GTM/Analytics)
  web: ^1.0.0
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  shelf: ^1.4.1

flutter:
  uses-material-design: true

  assets:
    - content.yaml
    - assets/images/
    - assets/icons/
    - assets/lottie/
