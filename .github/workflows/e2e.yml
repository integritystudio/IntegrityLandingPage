name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly multi-browser run at 6 AM UTC
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: "e2e-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ github.event_name }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Determine browsers to install
        id: browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "list=chromium firefox webkit" >> "$GITHUB_OUTPUT"
          else
            echo "list=chromium" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps ${{ steps.browsers.outputs.list }}

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps ${{ steps.browsers.outputs.list }}

      - name: Verify production site is reachable
        run: curl -sf --max-time 10 https://integritystudio.ai > /dev/null

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: https://integritystudio.ai
          CI: true
          # Multi-browser on nightly schedule only
          MULTI_BROWSER: ${{ github.event_name == 'schedule' && 'true' || '' }}

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
