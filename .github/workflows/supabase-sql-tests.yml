# TS17: Run every supabase/tests/*/run.sh against a throwaway Postgres cluster.
# Each run.sh spins up its own cluster with initdb on its own port and socket;
# no Docker, no Supabase CLI, no credentials — PR-safe, including from forks.
#
# Suites are discovered by glob, not listed, so a new suite directory is enrolled
# the moment it lands and a pinned list cannot decay.
name: Supabase SQL Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-sql-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-sql-tests.yml'

permissions:
  contents: read

concurrency:
  group: "supabase-sql-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sql-tests:
    name: SQL suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Test on the major version production runs. supabase/config.toml's
      # major_version is kept equal to the hosted project's (17.6 on 2026-09-28),
      # so it is read here rather than pinned a second time. run.sh defaults to
      # a local Homebrew 15 keg; that is a workstation convenience, not a target.
      - name: Resolve PostgreSQL major version
        run: |
          major="$(sed -nE 's/^major_version *= *([0-9]+).*/\1/p' supabase/config.toml)"
          if [ -z "$major" ]; then
            echo "::error::no major_version in supabase/config.toml"
            exit 1
          fi
          echo "PG_MAJOR=$major" >> "$GITHUB_ENV"

      # ubuntu-latest ships only one PostgreSQL major, so install the target one
      # from the PGDG apt repository.
      - name: Install PostgreSQL ${{ env.PG_MAJOR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-$PG_MAJOR"

      - name: Run every SQL suite
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
        run: |
          # run.sh falls back to any initdb on PATH; fail here instead if the
          # target major is missing, so no suite can run on the wrong version.
          "$PGBIN/postgres" --version
          shopt -s nullglob
          suites=(supabase/tests/*/run.sh)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::no supabase/tests/*/run.sh found"
            exit 1
          fi
          failed=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            bash "$suite" || { echo "::error::$suite failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"
