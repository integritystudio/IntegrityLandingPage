name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Generate coverage report
        run: |
          # Install lcov for coverage processing
          sudo apt-get update
          sudo apt-get install -y lcov

          # Add function coverage data (Flutter only outputs line coverage)
          dart scripts/add_function_coverage.dart coverage/lcov.info

          # Generate HTML coverage report with function coverage
          # Use --prefix to properly strip working directory and avoid duplicated paths
          genhtml coverage/lcov.info -o coverage/html --legend --title "Integrity Studio AI Coverage" --ignore-errors category --prefix "$(pwd)"

          # Generate coverage summary
          lcov --summary coverage/lcov.info > coverage/summary.txt 2>&1
          cat coverage/summary.txt

          # Extract coverage percentage for badge
          COVERAGE=$(grep "lines" coverage/summary.txt | grep -oP '\d+\.\d+' | head -1)
          echo "COVERAGE_PCT=${COVERAGE}" >> $GITHUB_ENV
          echo "Coverage: ${COVERAGE}%"

      - name: Create coverage badge
        run: |
          COVERAGE="${{ env.COVERAGE_PCT }}"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$COVERAGE >= 20" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi

          mkdir -p coverage/html
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > coverage/html/badge.json

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage/summary.txt', 'utf8');
            const coverage = '${{ env.COVERAGE_PCT }}';

            const body = `## 📊 Test Coverage Report

            **Coverage: ${coverage}%**

            <details>
            <summary>Coverage Summary</summary>

            \`\`\`
            ${summary}
            \`\`\`

            </details>

            [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (Download coverage-report artifact)
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('📊 Test Coverage Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check coverage threshold
        run: |
          COVERAGE="${{ env.COVERAGE_PCT }}"
          THRESHOLD=50

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%"
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold of ${THRESHOLD}%"
          fi

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Validate SRI hashes
        run: |
          echo "Validating Subresource Integrity hashes..."

          # Function to compute SHA384 hash in SRI format
          compute_sri() {
            openssl dgst -sha384 -binary "$1" | openssl base64 -A
          }

          # Validate meta-pixel.js SRI
          META_PIXEL_HASH=$(compute_sri "web/js/meta-pixel.js")
          META_PIXEL_EXPECTED="16kvMlWquRnr8GQdZabpqhB747TZjR3w70E7Pp9dW8yt7SpDSaCGN67fPeGjDfhF"
          if [ "$META_PIXEL_HASH" != "$META_PIXEL_EXPECTED" ]; then
            echo "::error::SRI hash mismatch for meta-pixel.js"
            echo "Expected: sha384-$META_PIXEL_EXPECTED"
            echo "Actual:   sha384-$META_PIXEL_HASH"
            echo "Update integrity attribute in web/index.html"
            exit 1
          fi
          echo "✅ meta-pixel.js SRI hash valid"

          # Validate gtm-init.js SRI
          GTM_INIT_HASH=$(compute_sri "web/js/gtm-init.js")
          GTM_INIT_EXPECTED="v692hxRppWhalTl5mhwTqx94kWKg+fNDvy3obmua5tJ7535mM2dbeBx169Z9uFvr"
          if [ "$GTM_INIT_HASH" != "$GTM_INIT_EXPECTED" ]; then
            echo "::error::SRI hash mismatch for gtm-init.js"
            echo "Expected: sha384-$GTM_INIT_EXPECTED"
            echo "Actual:   sha384-$GTM_INIT_HASH"
            echo "Update integrity attribute in web/index.html"
            exit 1
          fi
          echo "✅ gtm-init.js SRI hash valid"

          echo "All SRI hashes validated successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://integritystudio.ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: functions

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: web-build
          path: build/web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=integritystudio-ai --commit-dirty=true

  deploy-sender-worker:
    name: Deploy Sender Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: workers/sender-worker
        run: npm install

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Deploy to Cloudflare
        working-directory: workers/sender-worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:prd

  deploy-coverage:
    name: Deploy Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true  # Don't fail CI if Pages isn't enabled

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: coverage-report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
