name = "sender-worker"
main = "src/index.ts"
compatibility_date = "2026-03-19"
compatibility_flags = ["nodejs_compat"]

# Disable per-version preview URLs. With them enabled, every retained version
# gets a public `<version-prefix>-sender-worker.<subdomain>.workers.dev` URL with
# the CURRENT secrets bound — so superseded code stays callable. Verified
# 2026-07-27: the 2026-04-20 version answered 200, predating the per-IP auth
# rate limit (38b2878), the signup compensating rollback (c75592c), and the CORS
# origin-reflection fix (66f1825). Version IDs leak readily (wrangler prints one
# on every deploy, and CI logs retain them), so this is not obscurity worth
# relying on. BACKLOG.md CR14.
preview_urls = false

[[services]]
binding = "RECEIVER"
service = "api-provisioning-receiver"

# `enabled` on the parent table is required, not decorative. Without it the
# Worker deploys with `observability.enabled: false` even when `logs.enabled`
# and `traces.enabled` are both true — verified 2026-07-27 against a scratch
# deploy of bootstrap-worker-dev, which reported `enabled: false` with the
# child tables set and `enabled: true` once this line was added. That omission
# is why production has been running with observability off since the
# 2026-04-03 change that believed it had switched logs on (BACKLOG.md CR15).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker. Previously `npm run deploy` published straight
# over `sender-worker`, which is the Worker the released site calls: ci.yml
# builds with no --dart-define, so the app falls back to the compile-time
# default in lib/services/provisioning_service.dart.
#
# `services` and `observability` are non-inheritable keys and are repeated below.
#
# CAVEAT — this environment is not fully isolated. RECEIVER still binds to the
# production `api-provisioning-receiver`, because no dev receiver is deployed
# (it lives in the observability-toolkit repo). A `/send` event from a dev
# deploy therefore reaches the production receiver. The inline /signup and
# /signin paths do not go through RECEIVER and are isolated by whatever
# Supabase and Auth0 credentials the Doppler `dev` config supplies. Deploying a
# dev receiver and repointing this binding is tracked in BACKLOG.md CR02.
[env.dev]
name = "sender-worker-dev"

[[env.dev.services]]
binding = "RECEIVER"
service = "api-provisioning-receiver"

# Own namespace, so dev rate-limit counters cannot evict production ones.
# `kv_namespaces` is non-inheritable and must be repeated here.
[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "46a717cd692a4cc2969bff9504bcc87b"        # dev-RATE_LIMIT_KV
preview_id = "46a717cd692a4cc2969bff9504bcc87b"

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

# A named environment's observability block REPLACES the parent's rather than
# merging into it, so traces must be repeated here or dev silently runs without
# them while production has them.
[env.dev.observability.traces]
enabled = true

# KV namespace for cross-isolate auth rate limiting on /signup and /signin
# (BACKLOG.md CR03). Created 2026-07-27.
#
# The limiter enforces the limit without this binding — checkAuthRateLimit()
# counts in memory first and denies at AUTH_RATE_LIMIT_MAX (10 per 600s). What
# the binding adds is a count shared across isolates and colos, so attempts
# spread across colos are no longer undercounted.
#
# Titled AUTH_RATE_LIMIT_KV rather than RATE_LIMIT_KV because contact-form
# already owns a namespace by that title; the two workers must not share one.
# `preview_id` points at the dev namespace on purpose, so a local
# `wrangler dev` writes rate-limit keys to dev rather than production.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "766332ec6de3462fb29777aa1b6bc9d3"        # AUTH_RATE_LIMIT_KV
preview_id = "46a717cd692a4cc2969bff9504bcc87b" # dev-RATE_LIMIT_KV

# Secrets (set via wrangler secret put or doppler):
#   SHARED_SECRET              — HMAC key; must match provisioning receiver
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  — Supabase service role key
#   AUTH0_DOMAIN               — Auth0 tenant domain (e.g. dev-xxx.us.auth0.com)
#   AUTH0_CLIENT_ID            — Auth0 Regular Web App client ID (password grant / ROPC, for signing users in after creation)
#   AUTH0_CLIENT_SECRET        — Auth0 Regular Web App client secret
#   AUTH0_CLI_ID       — Auth0 M2M app client ID (client_credentials grant → /api/v2/ Management API, for user creation)
#   AUTH0_CLI_SECRET   — Auth0 M2M app client secret
#   AUTH0_AUDIENCE             — Auth0 API audience for ROPC tokens
#   ALLOWED_ORIGINS_JSON       — JSON array of allowed CORS origins (optional; defaults to integritystudio.ai)
#   STRIPE_SECRET_KEY          — Stripe secret key (sk_live_... or sk_test_...)
#   STRIPE_PLAN_TO_PRICE_JSON  — JSON map of plan → Stripe price ID, e.g. {"growth":"price_xxx","enterprise":"price_yyy"}
#   APP_BASE_URL               — Base URL for Stripe success/cancel redirects (optional; defaults to https://integritystudio.ai)
