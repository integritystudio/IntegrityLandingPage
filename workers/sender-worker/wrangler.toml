name = "sender-worker"
main = "src/index.ts"
compatibility_date = "2026-03-19"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "RECEIVER"
service = "api-provisioning-receiver"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via wrangler secret put or doppler):
#   SHARED_SECRET              — HMAC key; must match provisioning receiver
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  — Supabase service role key
#   AUTH0_DOMAIN               — Auth0 tenant domain (e.g. dev-xxx.us.auth0.com)
#   AUTH0_CLIENT_ID            — Auth0 app client ID (used for both ROPC password grant and M2M client_credentials grant)
#   AUTH0_CLIENT_SECRET        — Auth0 app client secret (used for both ROPC password grant and M2M client_credentials grant)
#   AUTH0_AUDIENCE             — Auth0 API audience (used for both ROPC and Management API calls; https://{domain}/api/v2/)
#   ALLOWED_ORIGINS_JSON       — JSON array of allowed CORS origins (optional; defaults to integritystudio.ai)
#   STRIPE_SECRET_KEY          — Stripe secret key (sk_live_... or sk_test_...)
#   STRIPE_PLAN_TO_PRICE_JSON  — JSON map of plan → Stripe price ID, e.g. {"growth":"price_xxx","enterprise":"price_yyy"}
#   APP_BASE_URL               — Base URL for Stripe success/cancel redirects (optional; defaults to https://integritystudio.ai)
