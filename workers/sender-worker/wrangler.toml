name = "sender-worker"
main = "src/index.ts"
compatibility_date = "2026-03-19"
compatibility_flags = ["nodejs_compat"]

# Disable per-version preview URLs. With them enabled, every retained version
# gets a public `<version-prefix>-sender-worker.<subdomain>.workers.dev` URL
# serving THAT VERSION'S bindings — a version is an immutable snapshot of code
# AND bindings, which is why `wrangler secret put` creates a new one. Two
# consequences: superseded code stays callable, and a later rotation does not
# reach it, because each version keeps serving the credential it was uploaded
# with. Corrected 2026-08-03 — this comment read "with the CURRENT secrets
# bound", which inverted the model and made rotation look like a remedy.
# Verified 2026-07-27: the 2026-04-20 version answered 200, predating the per-IP
# auth rate limit (38b2878), the signup compensating rollback (c75592c), and the
# CORS origin-reflection fix (66f1825). Version IDs leak readily (wrangler prints
# one on every deploy, and CI logs retain them), so this is not obscurity worth
# relying on. Inheritable, so this covers [env.dev] too. BACKLOG.md CR14.
preview_urls = false

[[services]]
binding = "RECEIVER"
service = "api-provisioning-receiver"

# `enabled` on the parent table is required, not decorative. Without it the
# Worker deploys with `observability.enabled: false` even when `logs.enabled`
# and `traces.enabled` are both true — verified 2026-07-27 against a scratch
# deploy of bootstrap-worker-dev, which reported `enabled: false` with the
# child tables set and `enabled: true` once this line was added. That omission
# is why production has been running with observability off since the
# 2026-04-03 change that believed it had switched logs on (BACKLOG.md CR15).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker. Previously `npm run deploy` published straight
# over `sender-worker`, which is the Worker the released site calls: ci.yml
# builds with no --dart-define, so the app falls back to the compile-time
# default in lib/services/provisioning_service.dart.
#
# `services` and `observability` are non-inheritable keys and are repeated below.
#
# Isolation: RECEIVER binds the DEV receiver `api-provisioning-receiver-dev`
# (repointed 2026-08-07, BACKLOG.md CR02 item 5 — until then it named the
# production receiver; see the note on [[env.dev.services]] below).
# /create-checkout-session does not go through RECEIVER and is isolated by the
# Supabase and Stripe credentials the Doppler `dev` config supplies.
[env.dev]
name = "sender-worker-dev"

# Points at the DEV receiver. `services` is non-inheritable, so this block is
# repeated rather than merged — and until 2026-08-07 it named the *production*
# receiver, which meant a dev `/send` would have provisioned against production
# the moment `sender-worker-dev` was given signing keys. The dev receiver now
# exists (`observability-toolkit`, `services/api-provisioning-receiver`
# `[env.dev]`), so the binding has a correct target. Guarded by the "dev never
# binds a production service" assertion in ../lib/deploy-environments.test.ts.
[[env.dev.services]]
binding = "RECEIVER"
service = "api-provisioning-receiver-dev"

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

# A named environment's observability block REPLACES the parent's rather than
# merging into it, so traces must be repeated here or dev silently runs without
# them while production has them.
[env.dev.observability.traces]
enabled = true

# No KV binding (CR49). RATE_LIMIT_KV backed the per-IP limiter on /signup,
# /signin and /forgot-password, which were removed with those routes. The
# namespaces themselves — AUTH_RATE_LIMIT_KV (766332ec6de3462fb29777aa1b6bc9d3)
# and dev-RATE_LIMIT_KV (46a717cd692a4cc2969bff9504bcc87b) — still exist in the
# account until deleted there.

# Secrets (set via wrangler secret put or doppler):
#   SHARED_SECRET              — RETIRED (BACKLOG.md CR29, closed 2026-08-03). Never read:
#                                resolveOutboundSigningKey has no fallback to it. Unbound from
#                                this Worker and the receiver 2026-08-03; deleted from Doppler
#                                prd 2026-08-03 and dev 2026-09-24. Do not re-bind it or add a
#                                fallback — the fallback was the whole defect. The test
#                                fixtures still declare it, with a value different from the
#                                active key, to prove signing ignores it while present.
#   SIGNING_KEYS               — JSON Record<keyId, secret>. REQUIRED: with ACTIVE_KEY_ID it is
#                                the only credential this worker signs with. Must match the
#                                receiver's SIGNING_KEYS exactly, or every signed request 401s
#                                with INVALID_SIGNATURE.
#                                Provisioned in prd 2026-07-30T01:28:47Z as key id "v2"
#                                (was recorded here as 2026-07-29 — that is the local PDT
#                                date, and it contradicted every other doc; dates in this
#                                file are UTC, matching the Workers API. Corrected and
#                                measured 2026-07-31: version 693d865d at 2026-07-29T21:20Z
#                                binds SHARED_SECRET only, 707a42ae at 01:28:53Z has both.)
#   ACTIVE_KEY_ID              — which SIGNING_KEYS entry to sign with, sent as x-key-id.
#                                REQUIRED: unset is a hard failure (500 SIGNING_KEY_UNRESOLVED,
#                                nothing forwarded), because the receiver rejects a request
#                                carrying no key id. Set to "v2" in prd 2026-07-30T01:28:53Z.
#     ⚠️ It used to say "omit to use SHARED_SECRET and send no x-key-id header". That was the
#     sender half of CR29: the receiver mapped an ABSENT x-key-id to SHARED_SECRET, a credential
#     with no key id and therefore no rotation handle, so removing a key from SIGNING_KEYS
#     revoked nothing. Both halves are closed — do not reintroduce the option, and do not add a
#     fallback to make an unset ACTIVE_KEY_ID "work". Staging a new key without activating it
#     belongs on the receiver, not here.
#     Rotation order is load-bearing — add the new key to the RECEIVER's SIGNING_KEYS and
#     deploy it FIRST, then set ACTIVE_KEY_ID here; see the deployment sequence comment
#     above forwardToReceiver() in src/index.ts. Also update KEY_ROTATION_DATES on the
#     receiver, or the new key ages without triggering the 90-day rotation alert.
#     Dev: sender-worker-dev binds the DEV receiver `api-provisioning-receiver-dev` (see
#     [env.dev] above, repointed 2026-08-07), so a dev SIGNING_KEYS/ACTIVE_KEY_ID pair can
#     only reach that receiver and must match ITS map. Never copy production's SIGNING_KEYS
#     into dev — that yields a second production-capable Worker, not a dev environment
#     (CLAUDE.md, BACKLOG.md CR11). Without the pair, dev /send 500s SIGNING_KEY_UNRESOLVED
#     and forwards nothing.
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  — Supabase service role key
#   AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, AUTH0_CLI_ID, AUTH0_CLI_SECRET,
#   AUTH0_AUDIENCE             — no longer read (CR49: the inline /signup, /signin and
#                                /forgot-password routes were removed). Unbind them.
#   ALLOWED_ORIGINS_JSON       — JSON array of allowed CORS origins (optional; defaults to integritystudio.ai and integritystudio.dev, apex and www — workers/lib/http/cors.ts)
#   STRIPE_SECRET_KEY          — Stripe API key: prd holds an rk_live_ restricted key, dev a sandbox key
#   STRIPE_PLAN_TO_PRICE_JSON  — JSON map of plan → Stripe price ID, e.g. {"growth":"price_xxx","enterprise":"price_yyy"}
#   APP_BASE_URL               — Base URL for Stripe success/cancel redirects (optional; defaults to https://integritystudio.ai)

# Local development: the Flutter app served at localhost:8080 signs in against the dev
# Workers, so dev (and only dev) allows that origin. An explicit list replaces the
# production defaults in workers/lib/http/cors.ts; production binds no such var.
# `vars` is non-inheritable and production defines none, so this block is dev-only.
[env.dev.vars]
ALLOWED_ORIGINS_JSON = '["http://localhost:8080"]'
