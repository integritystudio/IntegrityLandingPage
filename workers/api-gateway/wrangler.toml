name = "api-gateway"
main = "src/index.ts"
compatibility_date = "2026-03-19"

# Retained versions are otherwise published at per-version workers.dev URLs with
# the script's CURRENT secrets bound, so superseded code stays callable. Left
# unset this defaults to true, which would re-expose the worker on the next
# deploy even after the live setting is turned off. BACKLOG.md CR14.
preview_urls = false

# `routes` intentionally absent. A routes key here would capture
# api.integritystudio.ai/v1/* on every `deploy:prd`, displacing obtool-api's
# wildcard and swallowing its telemetry paths. The shipped Flutter app calls the
# workers.dev hostname directly, so no zone route is needed today. Topology
# decision is tracked in BACKLOG.md CR13; this removal is step 1. See also the
# [env.dev] comment below, which explains the inheritance hazard that made this
# block dangerous to leave in place.
#
# An `[env.staging]` block declaring staging-api.integritystudio.ai/v1/* was
# removed for the same reason. Nothing ever passed `--env staging` — no script,
# no workflow — so it was an unreachable route claim in the one file where a
# stray route claim has already caused an outage, and it repeated neither
# `durable_objects` nor `observability`, so deploying it would have produced a
# Worker with no DO namespace and no telemetry. Reinstate it only alongside a
# deploy path and the full binding set (BACKLOG.md CR13).

# Auth0 tenant that issues the dashboard's browser tokens. Plain `vars`, not secrets:
# both values appear in every JWT the Flutter app holds, so they are not confidential, and
# a checked-in var cannot be silently missing on a fresh deploy the way an unbound secret
# can — which is precisely how this Worker ended up in production with no
# API_KEY_HMAC_SECRET bound. `vars` is NOT inherited by named environments, so [env.dev]
# repeats the block below (same rule as durable_objects, opposite of routes).
[vars]
AUTH0_DOMAIN = "dev-68gg87ow4mg4kzyo.us.auth0.com"
AUTH0_AUDIENCE = "https://api.integritystudio.dev"

# Per-identity throttle for the routes that carry no org quota (/v1/me, /v1/orgs, /bootstrap).
# Quota is org-scoped billing metering and only guards /v1/orgs/:id/*; these routes have no org
# to meter against, so they were authenticated but otherwise unlimited. Shared namespace with
# sender-worker; keys are prefixed `gw_id_rl:` so the two cannot collide. `kv_namespaces` is NOT
# inherited by a named environment, so [env.dev] repeats it below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "766332ec6de3462fb29777aa1b6bc9d3"        # AUTH_RATE_LIMIT_KV

# Durable Objects
[[durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["QuotaDurableObject"]

# Observability. The parent `enabled` is required, not decorative: without it a
# Worker deploys with observability OFF even when the child tables are both
# true. That omission is why production `sender-worker` ran unmonitored for ~4
# months (BACKLOG.md CR15). This Worker had no observability block at all, so it
# has never emitted logs or traces — which is also why CR12's four-month outage
# went unnoticed. A named environment REPLACES this block rather than merging
# into it, so [env.dev] repeats it below (BACKLOG.md W04).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker so a local deploy cannot overwrite the one
# api.integritystudio.ai points at.
#
# `routes = []` MUST be explicit, and is the whole reason this comment is long.
# `routes` is an INHERITABLE key: a named environment that omits it inherits the
# top-level routes and attaches them to the dev Worker. On 2026-07-27 that is
# exactly what happened — `wrangler deploy --env dev` silently created
# `api.integritystudio.ai/v1/* -> api-gateway-dev`, handing the production
# hostname to a secret-less dev Worker. Deleting the key does not mean "no
# routes"; it means "production's routes". Only `[]` means none.
#
# Contrast with `durable_objects`, which is NOT inheritable and therefore has to
# be repeated below — the two rules pull in opposite directions, which is what
# made the mistake easy. `migrations` is inheritable and applies here unchanged;
# the dev Worker still gets its own DO namespace and quota counters, so dev
# traffic cannot consume a production org's quota.
[env.dev]
name = "api-gateway-dev"
routes = []

[env.dev.vars]
AUTH0_DOMAIN = "dev-68gg87ow4mg4kzyo.us.auth0.com"
AUTH0_AUDIENCE = "https://api.integritystudio.dev"

[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "46a717cd692a4cc2969bff9504bcc87b"        # dev-RATE_LIMIT_KV

[[env.dev.durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDurableObject"

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.observability.traces]
enabled = true

# Secrets (set via: wrangler secret put <NAME>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET — REMOVED: browser tokens are Auth0-issued and verified against
#   AUTH0_DOMAIN's JWKS, so nothing reads this. Unbound from the Worker 2026-07-30.
# API_KEY_HMAC_SECRET
# STRIPE_SECRET_KEY
# APP_URL (optional; defaults to https://app.integritystudio.ai)
# PAGERDUTY_INTEGRATION_KEY (optional; when set, fires PagerDuty trigger on unhealthy /health responses)
