name = "api-gateway"
main = "src/index.ts"
compatibility_date = "2026-03-19"

# Production routes attached on every plain `wrangler deploy` (no --env needed).
routes = [
  { pattern = "api.integritystudio.ai/v1/*", zone_name = "integritystudio.ai" }
]

[env.staging]
routes = [
  { pattern = "staging-api.integritystudio.ai/v1/*", zone_name = "integritystudio.ai" }
]

# Durable Objects
[[durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["QuotaDurableObject"]

# Secrets (set via: wrangler secret put <NAME>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# API_KEY_HMAC_SECRET
# STRIPE_SECRET_KEY
# APP_URL (optional; defaults to https://app.integritystudio.ai)
# PAGERDUTY_INTEGRATION_KEY (optional; when set, fires PagerDuty trigger on unhealthy /health responses)
