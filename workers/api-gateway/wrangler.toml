name = "api-gateway"
main = "src/index.ts"
compatibility_date = "2026-03-19"

# Retained versions are otherwise published at per-version workers.dev URLs
# serving the bindings THAT VERSION was uploaded with — a version is an immutable
# snapshot of code and bindings, which is why `wrangler secret put` creates a new
# one. So superseded code stays callable, and a later rotation does not reach it:
# each version keeps serving the credential it was uploaded with. Corrected
# 2026-08-03 — this read "with the script's CURRENT secrets bound", which
# inverted the model and made rotation look like a remedy. Left unset the key
# defaults to true, which would re-expose the worker on the next deploy even
# after the live setting is turned off; it is inheritable, so this one line also
# covers [env.dev]. BACKLOG.md CR14.
preview_urls = false

# This Worker's public hostname (BACKLOG.md CR13, decided 2026-08-08: option C).
#
# `custom_domain = true` is NOT the same key as a zone route, and the difference
# is the whole reason this line is safe where the old one was not. A route
# pattern claims a path on a hostname someone else may already serve; a custom
# domain binds ONE hostname to this Worker and creates its DNS record. The
# hostname is `api.integritystudio.dev` — a zone this repo's Workers are the
# only occupants of — so there is nothing here to displace.
#
# What this replaced, and why the replacement is not the same hazard:
# a `routes = ["api.integritystudio.ai/v1/*"]` key lived here until 2026-07-29.
# `/v1/*` is MORE SPECIFIC than obtool-api's `api.integritystudio.ai/*`, so
# every `deploy:prd` would have captured that path and swallowed obtool-api's
# telemetry routes — /v1/traces among them. That key is gone and must not come
# back: the two route tables are disjoint apart from /health (docs/api-routing.md),
# so this Worker has no claim on the .ai hostname at all.
#
# Deployed reality this line matches, rather than creates: the custom domain was
# provisioned 2026-08-08 (id e3f5d910…) after integritystudio.dev was migrated
# from Porkbun to Cloudflare. Declaring it here makes `deploy:prd` idempotent
# against that state instead of leaving the binding undeclared in source.
# Cloudflare represents it as an AAAA record to the discard prefix `100::` —
# do not "fix" that record or set it to DNS-only; graying it unbinds the Worker
# while leaving the hostname resolving, which fails as a 522 rather than loudly.
routes = [{ pattern = "api.integritystudio.dev", custom_domain = true }]

# An `[env.staging]` block declaring staging-api.integritystudio.ai/v1/* was
# removed for the same reason the .ai route was. Nothing ever passed
# `--env staging` — no script, no workflow — so it was an unreachable route
# claim in the one file where a stray route claim has already caused an outage,
# and it repeated neither
# `durable_objects` nor `observability`, so deploying it would have produced a
# Worker with no DO namespace and no telemetry. Reinstate it only alongside a
# deploy path and the full binding set (BACKLOG.md CR13).

# Auth0 tenant that issues the dashboard's browser tokens. Plain `vars`, not secrets:
# both values appear in every JWT the Flutter app holds, so they are not confidential, and
# a checked-in var cannot be silently missing on a fresh deploy the way an unbound secret
# can — which is precisely how this Worker ended up in production with no
# API_KEY_HMAC_SECRET bound. `vars` is NOT inherited by named environments, so [env.dev]
# repeats the block below (same rule as durable_objects, opposite of routes).
[vars]
AUTH0_DOMAIN = "dev-68gg87ow4mg4kzyo.us.auth0.com"
AUTH0_AUDIENCE = "https://api.integritystudio.dev"
# Who may call the `/v1/admin/*` staff routes (src/routes/admin.ts): a JSON array of
# `users.id` UUIDs. These routes read any org's billing, usage, quota and entitlements for
# the observability dashboard's admin customer view, so the list is the whole access
# control — the dashboard's own staff check is presentation only. It is a COPY of
# `STAFF_USER_IDS` in quality-metrics-dashboard/wrangler.toml (same nine ids: the six
# @integritystudio.ai accounts plus three of the owner's other accounts, 2026-10-06, when a
# tenth id that no longer existed in `users` was dropped from both): the two drift unless
# changed together. `vars` is not inherited, so [env.dev] repeats it.
STAFF_USER_IDS = '["f7a787eb-b97f-4636-b68d-2a08c52ae13d","b178a643-7bde-44d9-b533-fd9c827786b3","f5e6d6e0-f618-46bb-9b17-477f0016148e","cc43086f-708f-467c-9483-666b1e294832","ed37810d-0792-47c6-9108-a3a1f62a8eaa","adff602e-1ac6-4f86-9ee3-2e880123f6dd","f78fdf56-6a7a-461b-8cfc-c80d1746d693","ce183805-4b76-454a-b198-7e12dbcd86c9","39557dad-3019-4fd1-a38d-4c99afa8307f"]'

# Per-identity throttle for the routes that carry no org quota (/v1/me, /v1/orgs, /bootstrap).
# Quota is org-scoped billing metering and only guards /v1/orgs/:id/*; these routes have no org
# to meter against, so they were authenticated but otherwise unlimited. Shared namespace with
# sender-worker; keys are prefixed `gw_id_rl:` so the two cannot collide. `kv_namespaces` is NOT
# inherited by a named environment, so [env.dev] repeats it below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "766332ec6de3462fb29777aa1b6bc9d3"        # AUTH_RATE_LIMIT_KV

# Auth0 log poller (BACKLOG.md CR40): pulls GET /api/v2/logs into auth0_logs, because the
# tenant's plan refuses log streams. Retention is about a day, so 15 minutes is wide margin.
# Its checkpoint and cached token live in RATE_LIMIT_KV under `auth0_logs:`. `triggers` IS
# inherited by a named environment, so [env.dev] empties it explicitly below.
[triggers]
crons = ["*/15 * * * *"]

# Durable Objects
[[durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["QuotaDurableObject"]

# Observability. The parent `enabled` is required, not decorative: without it a
# Worker deploys with observability OFF even when the child tables are both
# true. That omission is why production `sender-worker` ran unmonitored for ~4
# months (BACKLOG.md CR15). This Worker had no observability block at all, so it
# has never emitted logs or traces — which is also why CR12's four-month outage
# went unnoticed. A named environment REPLACES this block rather than merging
# into it, so [env.dev] repeats it below (BACKLOG.md W04).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker so a local deploy cannot overwrite the one
# api.integritystudio.dev points at (custom domain, CR13). The `.ai` hostname in
# the incident below is the toolkit's `obtool-api` wildcard; do not repoint it.
#
# `routes = []` MUST be explicit, and is the whole reason this comment is long.
# `routes` is an INHERITABLE key: a named environment that omits it inherits the
# top-level routes and attaches them to the dev Worker. On 2026-07-27 that is
# exactly what happened — `wrangler deploy --env dev` silently created
# `api.integritystudio.ai/v1/* -> api-gateway-dev`, handing the production
# hostname to a secret-less dev Worker. Deleting the key does not mean "no
# routes"; it means "production's routes". Only `[]` means none.
#
# Contrast with `durable_objects`, which is NOT inheritable and therefore has to
# be repeated below — the two rules pull in opposite directions, which is what
# made the mistake easy. `migrations` is inheritable and applies here unchanged;
# the dev Worker still gets its own DO namespace and quota counters, so dev
# traffic cannot consume a production org's quota.
[env.dev]
name = "api-gateway-dev"
routes = []

# No Auth0 log poller in dev: it holds no read:logs client, and the dev tenant's log is not
# worth a cron. Without this line dev would inherit production's schedule.
[env.dev.triggers]
crons = []

# The DEV tenant — the same value as Doppler `dev` AUTH0_DOMAIN, which is where
# sender-worker-dev mints its tokens. From 2026-07-30 to 2026-09-27 this block was
# a verbatim copy of [vars] above, so api-gateway-dev verified JWTs against the
# PRODUCTION tenant's JWKS: dev-tenant tokens 401'd here and production tokens
# were accepted. `check:env-isolation` reads Doppler, never `vars`, so it could
# not see it; ../lib/deploy-environments.test.ts now pins the two domains apart.
# AUTH0_AUDIENCE is deliberately the same string as production: the dev tenant
# registers its own API under that identifier ("Integrity Studio API (dev)"),
# and an audience is an opaque id, not a hostname.
[env.dev.vars]
AUTH0_DOMAIN = "dev-njjmghdzm23uy0p7.us.auth0.com"
AUTH0_AUDIENCE = "https://api.integritystudio.dev"
# Dev-only origins. An explicit list replaces the production defaults in
# workers/lib/http/cors.ts; production binds no such var.
# - localhost:8080: the Flutter app in local development.
# - localhost:5173 and quality-metrics-api-dev: the quality-metrics dashboard (Vite dev server
#   and its dev Worker), whose admin customer view reads these routes with a dev-tenant token
#   (observability-toolkit dashboard backlog, ADMIN-CV-CORS-AUDIENCE).
ALLOWED_ORIGINS_JSON = '["http://localhost:8080", "http://localhost:5173", "https://quality-metrics-api-dev.alyshia-b38.workers.dev"]'
# Dev-project (tumhmtshahktumhqqamk) `users.id`s, not production's: the two @integritystudio.ai
# accounts there on 2026-10-06, dev-test@ and dev-signup-test@. The `test+e2e<timestamp>@`
# rows the e2e suite leaves behind are deliberately absent — each run mints a fresh one, so
# listing old ones grants nothing and a reused one would bypass the membership tests. Same
# list as the dashboard's [env.dev.vars]; change both together. Redeploy with `npm run deploy`.
STAFF_USER_IDS = '["71226e17-8969-4699-bb77-836ca2351ecf","c93fc459-e2d5-43fb-84b0-6022d32e313f"]'

[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "46a717cd692a4cc2969bff9504bcc87b"        # dev-RATE_LIMIT_KV

[[env.dev.durable_objects.bindings]]
name = "QUOTA_DO"
class_name = "QuotaDurableObject"

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.observability.traces]
enabled = true

# Secrets (set via: wrangler secret put <NAME>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET — REMOVED: browser tokens are Auth0-issued and verified against
#   AUTH0_DOMAIN's JWKS, so nothing reads this. Unbound from the Worker 2026-07-30.
# API_KEY_HMAC_SECRET
# STRIPE_SECRET_KEY
# APP_URL (optional; defaults to https://app.integritystudio.ai)
# PAGERDUTY_INTEGRATION_KEY (optional; when set, fires PagerDuty trigger on unhealthy /health responses)
# AUTH0_LOG_STREAM_TOKEN (the Auth0 log stream's bearer token; /v1/auth0-logs answers 503 while unbound — CR40)
