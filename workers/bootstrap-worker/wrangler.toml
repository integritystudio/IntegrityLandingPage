name = "bootstrap-worker"
main = "src/index.ts"
compatibility_date = "2026-03-19"

# JWT secret for Supabase JWT verification (set via: wrangler secret put SUPABASE_JWT_SECRET)
# Environment variables for Supabase credentials
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be set in wrangler.toml or via env vars

# Observability. The parent `enabled` is required, not decorative: without it a
# Worker deploys with observability OFF even when the child tables are both
# true — verified 2026-07-27 against a scratch deploy of this very Worker, which
# reported `enabled: false` with only the child tables set (BACKLOG.md CR15).
# A named environment REPLACES this block rather than merging into it, so
# [env.dev] repeats it below (BACKLOG.md W04).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker so a local deploy cannot overwrite production.
# No bindings to repeat.
[env.dev]
name = "bootstrap-worker-dev"

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.observability.traces]
enabled = true
