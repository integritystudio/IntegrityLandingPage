name = "integrity-studio-contact"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# No per-version preview URLs: this worker binds CSRF_SECRET and RESEND_API_KEY,
# and preview URLs would keep superseded versions publicly callable with them.
# See BACKLOG.md CR14.
preview_urls = false

[vars]
RECIPIENT_EMAIL = "hello@integritystudio.ai"
SENDER_EMAIL = "contact@integritystudio.ai"

# Environment identifier for fail-closed rate limiting
# Set to "production" in prod, "staging" for staging, "development" for local
ENVIRONMENT = "production"

# Rate limiting configuration
RATE_LIMIT_MAX = "5"
RATE_LIMIT_WINDOW_SECONDS = "60"

# CSRF protection (set via: wrangler secret put CSRF_SECRET)
# Generate a secure random secret: openssl rand -base64 32

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "cf9d7d72bb07488faab8187ceb3589d4"
preview_id = "fcd1e5c8e2f04d03a5ceda5f1b3373c3"

# Observability. The parent `enabled` is required, not decorative: without it a
# Worker deploys with observability OFF even when the child tables are both true
# (BACKLOG.md CR15). This Worker had no observability block at all, so the
# structured rate-limit and idempotency logs it already emits — including the
# `rate_limit_kv_unavailable` error path — have been going nowhere. A named
# environment REPLACES this block rather than merging, so [env.dev] repeats it
# below (BACKLOG.md W04).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker so a local deploy cannot overwrite the one
# handling live contact submissions.
#
# `vars` is non-inheritable and is repeated below with ENVIRONMENT flipped to
# "development", which is what the structured rate-limit logs key on.
#
# Dev binds its OWN namespace (created 2026-07-27), never the production one —
# a dev deploy sharing it would evict live rate-limit and idempotency keys.
[env.dev]
name = "integrity-studio-contact-dev"

[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5719e56903b94ca5bf55cb8175d2e2a9"        # CONTACT_RATE_LIMIT_KV_DEV
preview_id = "5719e56903b94ca5bf55cb8175d2e2a9"

# Dev recipients must never be the production addresses (CR11 step 5): the
# moment dev holds a RESEND_API_KEY, test submissions would land in the real
# business inbox. Recipient is the developer; sender stays on the one
# Resend-verified domain (Resend verifies domains, not localparts) with a
# distinct localpart so dev traffic is identifiable in the inbox and in
# Resend's logs. Dev's key is sending-scoped and separate from production's.
[env.dev.vars]
RECIPIENT_EMAIL = "alyshialedlie@gmail.com"
SENDER_EMAIL = "contact-dev@integritystudio.ai"
ENVIRONMENT = "development"
RATE_LIMIT_MAX = "5"
RATE_LIMIT_WINDOW_SECONDS = "60"

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.observability.traces]
enabled = true
