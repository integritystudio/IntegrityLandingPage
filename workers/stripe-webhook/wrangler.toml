name = "stripe-webhook"
main = "src/index.ts"
compatibility_date = "2026-03-19"

# Retained versions are otherwise published at per-version workers.dev URLs
# serving the bindings THAT VERSION was uploaded with — a version is an immutable
# snapshot of code and bindings, which is why `wrangler secret put` creates a new
# one. So superseded code stays callable, and a later rotation does not reach it:
# each version keeps serving the credential it was uploaded with. Corrected
# 2026-08-03 — this read "with the script's CURRENT secrets bound", which
# inverted the model and made rotation look like a remedy. Left unset the key
# defaults to true, which would re-expose the worker on the next deploy even
# after the live setting is turned off.
#
# `preview_urls` IS inheritable (unlike bindings), so this one line covers
# [env.dev] too — no repetition needed below. But a config value only lands on
# deploy, and `wrangler secret put` applies no wrangler.toml: this line was added
# 2026-07-29 while stripe-webhook-dev's last CODE deploy was 2026-07-27, so the
# dev Worker still read `previews_enabled: true` and had one live version holding
# four secrets. Closed 2026-08-03 by an API flip (with `"enabled":true` preserved,
# or the workers.dev hostname Stripe's test-mode endpoint delivers to goes down);
# the next `npm run deploy` makes it stick. BACKLOG.md CR14.
preview_urls = false

# Stripe webhook secret (set via: wrangler secret put STRIPE_WEBHOOK_SECRET)
# Retrieve from Stripe Dashboard > Developers > Webhooks > Signing secret

# Supabase credentials (set via environment variables or wrangler secrets)
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be configured

# Reconciliation cron: retries dead letters and detects missed events every 15 minutes
# Note: Cloudflare API format requires: cron = "schedule"
[triggers]
crons = ["*/15 * * * *"]

# Observability. The parent `enabled` is required, not decorative: without it a
# Worker deploys with observability OFF even when the child tables are both true
# (BACKLOG.md CR15). This Worker had no observability block at all, which is why
# the cron above has been failing silently ~96x/day since 2026-03-31 — it has
# zero secrets bound, so it cannot reach Supabase to drain webhook_dead_letters,
# and nothing recorded the failures (BACKLOG.md CR12). A named environment
# REPLACES this block rather than merging, so [env.dev] repeats it below.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# --- dev environment (`npm run deploy`) -------------------------------------
# Publishes to a separate Worker so a local deploy cannot overwrite the one
# receiving live Stripe webhooks.
#
# `triggers` is non-inheritable, and the empty cron list is deliberate: the
# dead-letter retry cron must not run in dev. Two Workers both draining
# `webhook_dead_letters` against the same Supabase project would race each
# other over production rows every 15 minutes.
[env.dev]
name = "stripe-webhook-dev"

[env.dev.triggers]
crons = []

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.observability.traces]
enabled = true
